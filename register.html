<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - ProctorPlus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 my-6">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/20 p-8 text-white">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight">Student Registration</h1>
            <p class="text-slate-300 text-xs mt-1">Submit your details for Proctor approval (M1 Module)</p>
            <p class="text-xs text-indigo-300 mt-2 font-medium">Jiya Patel - 25012022018</p>
        </div>

        <!-- Form -->
        <form id="reg-form" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Enrollment Number</label>
                <input type="text" id="eno" placeholder="e.g. 25012022018" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Branch</label>
                    <input type="text" id="branch" placeholder="e.g. Computer Eng." class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Semester</label>
                    <select id="semester" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" required>
                        <option value="" disabled selected>Select</option>
                        <option value="1">Sem 1</option>
                        <option value="2">Sem 2</option>
                        <option value="3">Sem 3</option>
                        <option value="4">Sem 4</option>
                        <option value="5">Sem 5</option>
                        <option value="6">Sem 6</option>
                        <option value="7">Sem 7</option>
                        <option value="8">Sem 8</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Student Contact</label>
                    <input type="tel" id="contact" placeholder="10-digit mobile" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Parent Contact</label>
                    <input type="tel" id="parent-contact" placeholder="10-digit mobile" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" required>
            </div>

            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-medium text-sm transition-colors shadow-lg shadow-indigo-600/30 mt-2">
                Submit Registration
            </button>
            
            <div id="form-msg" class="text-xs mt-2 text-center font-medium"></div>
        </form>

        <!-- Back Link -->
        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-indigo-300 hover:text-indigo-200 transition-colors">
                &larr; Back to Login / Home
            </a>
        </div>

    </div>

    <script>
        // Live Render Backend API URL
        const API_URL = 'https://proctorplus-hyim.onrender.com';

        document.getElementById('reg-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('form-msg');

            const formData = {
                enrollment: document.getElementById('eno').value.trim(),
                name: document.getElementById('name').value.trim(),
                branch: document.getElementById('branch').value.trim(),
                semester: document.getElementById('semester').value,
                email: document.getElementById('email').value.trim(),
                contact: document.getElementById('contact').value.trim(),
                parent_contact: document.getElementById('parent-contact').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                msgDiv.className = "text-xs mt-2 text-center text-indigo-300 font-medium";
                msgDiv.innerText = "Submitting registration...";

                const response = await fetch(`${API_URL}/api/students/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    msgDiv.className = "text-xs mt-2 text-center text-green-400 font-medium";
                    msgDiv.innerText = "Registration sent successfully! Waiting for proctor approval.";
                    document.getElementById('reg-form').reset();
                } else {
                    msgDiv.className = "text-xs mt-2 text-center text-amber-400 font-medium";
                    msgDiv.innerText = data.detail || "Registration failed. Enrollment might already exist.";
                }
            } catch (err) {
                msgDiv.className = "text-xs mt-2 text-center text-red-400 font-medium";
                msgDiv.innerText = "Server connection error. Please make sure FastAPI is running.";
            }
        });
    </script>
</body>
</html>
